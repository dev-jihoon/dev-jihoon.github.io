<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orange">
<title>Orange</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eee; font-family: -apple-system, sans-serif;
               overscroll-behavior: none; touch-action: none; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #qt { position: fixed; inset: 0; touch-action: none; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #fff; z-index: 10; }
  #status { color: #555; font-size: 15px; }
  #bar { width: 260px; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #f7941d; transition: width .3s; }
  #err { color: #b00; white-space: pre-wrap; font: 12px monospace; max-width: 90vw; max-height: 40vh; overflow: auto; }
  #webdlg { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
  #webdlg .box { background: #f2f2f2; color: #222; border: 1px solid #aaa; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.3);
                 padding: 16px 18px; min-width: 280px; font: 15px -apple-system, "DejaVu Sans", sans-serif; }
  #webdlg .title { font-weight: 600; margin-bottom: 14px; word-break: break-all; }
  #webdlg .row { display: flex; gap: 10px; justify-content: flex-end; }
  #webdlg .btn, #webdlg button { position: relative; overflow: hidden; display: inline-block; padding: 8px 16px; border: 1px solid #999; border-radius: 4px;
                 background: #fff; color: #222; font: inherit; text-decoration: none; cursor: pointer; }
  #webdlg .primary { background: #2a82da; border-color: #1f6fbf; color: #fff; }
  #webdlg input[type=file] { position: absolute; inset: 0; opacity: 0; font-size: 100px; cursor: pointer; }
</style>
</head>
<body>
<div id="qt"></div>
<div id="loading"><div style="font-size:20px;font-weight:600">Orange</div><div id="bar"><div></div></div><div id="status">Loading</div><div style="color:#999;font-size:12px">The first visit may take a minute or two. Later visits are faster.</div><div id="err"></div></div>
<script>
// iPad Safari ignores user-scalable=no: stop double-tap and pinch zoom ourselves.
// (Qt reads pointer events, so cancelling the touch events' default does not
// change what Qt sees.)
(() => {
  let lastEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastEnd < 400 && !(e.target.closest && e.target.closest("#webdlg"))) e.preventDefault();
    lastEnd = now;
  }, { passive: false, capture: true });
  document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); },
                            { passive: false, capture: true });
  // Qt draws into canvases inside its shadow DOM; page CSS does not reach them
  const iv = setInterval(() => {
    const root = document.getElementById("qt-shadow-container")?.shadowRoot;
    if (!root) return;
    const st = document.createElement("style");
    st.textContent = "* { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; }";
    root.appendChild(st);
    clearInterval(iv);
  }, 500);
  // When the on-screen keyboard opens, Safari scrolls the page even though it
  // cannot scroll; scroll it back so touches land where Qt draws.
  const unscroll = () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); };
  window.addEventListener("scroll", unscroll, { passive: true });
  window.visualViewport?.addEventListener("resize", unscroll);
  window.visualViewport?.addEventListener("scroll", unscroll);
  for (const t of ["gesturestart", "gesturechange", "gestureend", "dblclick"])
    document.addEventListener(t, (e) => e.preventDefault(), { passive: false, capture: true });
})();
</script>
<script type="module">
import { loadPyodide } from "./pyodide.mjs";
// Packages Orange needs before its window can open
const STARTUP_PACKAGES = ["numpy", "scipy", "scikit-learn", "pandas", "bottleneck", "joblib",
  "threadpoolctl", "requests", "pyyaml", "httpx", "xlrd", "pygments", "packaging",
  "python-dateutil", "pytz", "sqlite3", "ssl", "lzma"];
// Packages only a few widgets use; loaded in the background once Orange is up
const LATER_PACKAGES = ["networkx"];
// ?touchdebug: blue dot = where the finger touched, red/green = where Qt got
// the press/release. They should overlap.
if (new URLSearchParams(location.search).has("touchdebug")) {
  window.orangeTouchDebug = true;
  const dot = (x, y, color, size) => {
    const d = document.createElement("div");
    d.style.cssText = `position:fixed;left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;border-radius:50%;border:2px solid ${color};z-index:30;pointer-events:none`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2500);
  };
  document.addEventListener("pointerdown", (e) => dot(e.clientX, e.clientY, "#06f", 28), true);
  window.orangeQtPoint = (x, y, press) => dot(x, y, press ? "#e00" : "#0a0", press ? 16 : 10);
}
// Browser file helpers used from Python (webpatches.py)
// Browsers only open the file picker or start a download from inside a user's
// tap or click. Qt handles the tap a moment later, which iPad browsers do not
// accept, so on touch devices (or when the tap no longer counts) we show a
// small box with a real file button / download link to tap.
const isTouch = navigator.maxTouchPoints > 0;
const needsOwnTap = () => isTouch || !(navigator.userActivation && navigator.userActivation.isActive);
const webDialog = (title, buildAction) => {
  document.getElementById("webdlg")?.remove();
  const bg = document.createElement("div");
  bg.id = "webdlg";
  bg.innerHTML = `<div class="box"><div class="title"></div><div class="row"><span class="act"></span><button class="cancel">Cancel</button></div></div>`;
  bg.querySelector(".title").textContent = title;
  const close = () => bg.remove();
  bg.querySelector(".cancel").onclick = close;
  bg.addEventListener("pointerdown", (e) => { if (e.target === bg) close(); });
  buildAction(bg.querySelector(".act"), close);
  document.body.appendChild(bg);
};
const readPicked = async (input, cb) => {
  const f = input.files[0];
  if (!f) return;
  const buf = new Uint8Array(await f.arrayBuffer());
  cb(f.name, buf);
};
const picker = document.createElement("input");
picker.type = "file"; picker.style.display = "none"; document.body.appendChild(picker);
window.orangeWebPickFile = (accept, cb) => {
  if (needsOwnTap()) {
    webDialog("Open file", (slot, close) => {
      const label = document.createElement("label");
      label.className = "btn primary";
      label.textContent = "Choose File\u2026";
      const input = document.createElement("input");
      input.type = "file"; input.accept = accept || "";
      input.onchange = () => { close(); readPicked(input, cb); };
      label.appendChild(input);
      slot.appendChild(label);
    });
    return;
  }
  picker.accept = accept || "";
  picker.value = "";
  picker.onchange = () => readPicked(picker, cb);
  picker.click();
};
window.orangeModified = false;
window.addEventListener("beforeunload", (e) => {
  if (window.orangeModified) { e.preventDefault(); e.returnValue = ""; }
});
window.orangeWebDownload = (name, data) => {
  const blob = new Blob([data], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const later = () => setTimeout(() => URL.revokeObjectURL(url), 60000);
  if (needsOwnTap()) {
    webDialog("Save " + name, (slot, close) => {
      const a = document.createElement("a");
      a.className = "btn primary"; a.href = url; a.download = name; a.textContent = "Download";
      a.onclick = () => { setTimeout(close, 0); later(); };
      slot.appendChild(a);
    });
    return;
  }
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  later();
};
const st = (msg, pct) => { document.getElementById("status").textContent = msg; if (pct != null) document.querySelector("#bar>div").style.width = pct + "%"; console.log("[boot]", (performance.now()/1000).toFixed(1) + "s", msg); };
try {
  st("Loading Python", 5);
  // Start downloading Orange and the font right away, in parallel with Python
  const tarP = fetch("./orange-sp.tar").then(r => r.arrayBuffer());
  const fontP = fetch("./NanumGothic.ttf").then(r => r.arrayBuffer());
  const bootP = fetch("./boot.py?" + Date.now()).then(r => r.text());
  const patchP = fetch("./webpatches.py?" + Date.now()).then(r => r.text());
  const regP = fetch("./widget-registry.pck").then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
  const py = await loadPyodide({ indexURL: "./" });
  window.py = py;
  st("Loading packages", 25);
  await py.loadPackage(STARTUP_PACKAGES);
  st("Loading Orange", 70);
  const tar = await tarP;
  py.unpackArchive(tar, "tar", { extractDir: "/lib/python3.13/site-packages" });
  const boot = await bootP;
  py._module.qtContainerElements = [document.getElementById("qt")];
  st("Starting", 90);
  py.FS.writeFile("/boot.py", boot);
  py.FS.mkdirTree("/fonts");
  py.FS.writeFile("/fonts/NanumGothic.ttf", new Uint8Array(await fontP));
  py.FS.writeFile("/webpatches.py", await patchP);
  const reg = await regP;
  if (reg) py.FS.writeFile("/widget-registry.pck", new Uint8Array(reg));
  await py.runPythonAsync(`exec(compile(open('/boot.py').read(), 'boot.py', 'exec'), {'__name__': '__main__'})`);
  document.getElementById("loading").style.display = "none";
  console.log("[boot] ready", (performance.now()/1000).toFixed(1) + "s");
  py.loadPackage(LATER_PACKAGES, { messageCallback: () => {} })
    .then(() => console.log("[boot] background packages loaded", (performance.now()/1000).toFixed(1) + "s"))
    .catch((e) => console.log("[boot] background packages failed " + e));
  const q = new URLSearchParams(location.search);
  if (q.get("test")) {
    const code = await (await fetch("./" + q.get("test") + "?" + Date.now())).text();
    py.FS.writeFile("/test.py", code);
    await py.runPythonAsync(`exec(compile(open('/test.py').read(), 'test.py', 'exec'), {'__name__': '__test__'})`);
    console.log("[test] done");
  }
} catch (e) {
  document.getElementById("err").textContent = String(e);
  console.log("[boot] ERROR " + e);
}
</script>
</body>
</html>
