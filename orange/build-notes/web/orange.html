<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orange">
<title>Orange</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eee; font-family: -apple-system, sans-serif;
               overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #qt { position: fixed; inset: 0; touch-action: none; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #fff; z-index: 10; }
  #status { color: #555; font-size: 15px; }
  #bar { width: 260px; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #f7941d; transition: width .3s; }
  #err { color: #b00; white-space: pre-wrap; font: 12px monospace; max-width: 90vw; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<div id="qt"></div>
<div id="loading"><div style="font-size:20px;font-weight:600">Orange</div><div id="bar"><div></div></div><div id="status">Loading</div><div style="color:#999;font-size:12px">The first visit may take a minute or two. Later visits are faster.</div><div id="err"></div></div>
<script type="module">
import { loadPyodide } from "./pyodide.mjs";
// Packages Orange needs before its window can open
const STARTUP_PACKAGES = ["numpy", "scipy", "scikit-learn", "pandas", "bottleneck", "joblib",
  "threadpoolctl", "requests", "pyyaml", "httpx", "xlrd", "pygments", "packaging",
  "python-dateutil", "pytz", "sqlite3", "ssl", "lzma"];
// Packages only a few widgets use; loaded in the background once Orange is up
const LATER_PACKAGES = ["networkx"];
// Browser file helpers used from Python (webpatches.py)
const picker = document.createElement("input");
picker.type = "file"; picker.style.display = "none"; document.body.appendChild(picker);
window.orangeWebPickFile = (accept, cb) => {
  picker.accept = accept || "";
  picker.value = "";
  picker.onchange = async () => {
    const f = picker.files[0];
    if (!f) return;
    const buf = new Uint8Array(await f.arrayBuffer());
    cb(f.name, buf);
  };
  picker.click();
};
window.orangeModified = false;
window.addEventListener("beforeunload", (e) => {
  if (window.orangeModified) { e.preventDefault(); e.returnValue = ""; }
});
window.orangeWebDownload = (name, data) => {
  const blob = new Blob([data], { type: "application/octet-stream" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
const st = (msg, pct) => { document.getElementById("status").textContent = msg; if (pct != null) document.querySelector("#bar>div").style.width = pct + "%"; console.log("[boot]", (performance.now()/1000).toFixed(1) + "s", msg); };
try {
  st("Loading Python", 5);
  // Start downloading Orange and the font right away, in parallel with Python
  const tarP = fetch("./orange-sp.tar").then(r => r.arrayBuffer());
  const fontP = fetch("./NanumGothic.ttf").then(r => r.arrayBuffer());
  const bootP = fetch("./boot.py?" + Date.now()).then(r => r.text());
  const patchP = fetch("./webpatches.py?" + Date.now()).then(r => r.text());
  const regP = fetch("./widget-registry.pck").then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
  const py = await loadPyodide({ indexURL: "./" });
  window.py = py;
  st("Loading packages", 25);
  await py.loadPackage(STARTUP_PACKAGES);
  st("Loading Orange", 70);
  const tar = await tarP;
  py.unpackArchive(tar, "tar", { extractDir: "/lib/python3.13/site-packages" });
  const boot = await bootP;
  py._module.qtContainerElements = [document.getElementById("qt")];
  st("Starting", 90);
  py.FS.writeFile("/boot.py", boot);
  py.FS.mkdirTree("/fonts");
  py.FS.writeFile("/fonts/NanumGothic.ttf", new Uint8Array(await fontP));
  py.FS.writeFile("/webpatches.py", await patchP);
  const reg = await regP;
  if (reg) py.FS.writeFile("/widget-registry.pck", new Uint8Array(reg));
  await py.runPythonAsync(`exec(compile(open('/boot.py').read(), 'boot.py', 'exec'), {'__name__': '__main__'})`);
  document.getElementById("loading").style.display = "none";
  console.log("[boot] ready", (performance.now()/1000).toFixed(1) + "s");
  py.loadPackage(LATER_PACKAGES, { messageCallback: () => {} })
    .then(() => console.log("[boot] background packages loaded", (performance.now()/1000).toFixed(1) + "s"))
    .catch((e) => console.log("[boot] background packages failed " + e));
  const q = new URLSearchParams(location.search);
  if (q.get("test")) {
    const code = await (await fetch("./" + q.get("test") + "?" + Date.now())).text();
    py.FS.writeFile("/test.py", code);
    await py.runPythonAsync(`exec(compile(open('/test.py').read(), 'test.py', 'exec'), {'__name__': '__test__'})`);
    console.log("[test] done");
  }
} catch (e) {
  document.getElementById("err").textContent = String(e);
  console.log("[boot] ERROR " + e);
}
</script>
</body>
</html>
